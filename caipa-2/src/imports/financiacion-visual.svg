<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 420" fill="none">
  <defs>
    <linearGradient id="fin-diamond" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#6f86ff" />
      <stop offset="55%" stop-color="#354ee7" />
      <stop offset="100%" stop-color="#1c2f9e" />
    </linearGradient>
    <radialGradient id="fin-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#354ee7" stop-opacity="0.5" />
      <stop offset="100%" stop-color="#354ee7" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- ambient glow, pulses -->
  <circle cx="210" cy="220" r="170" fill="url(#fin-glow)">
    <animate attributeName="opacity" values="0.55;1;0.55" dur="2.6s" repeatCount="indefinite" />
  </circle>

  <!-- faint floor grid -->
  <g stroke="#354ee7" stroke-opacity="0.15" stroke-width="1.5">
    <path d="M40 300 L210 360 L380 300" />
    <path d="M70 280 L210 330 L350 280" />
    <path d="M100 260 L210 300 L320 260" />
  </g>

  <!-- floating + rotating rounded diamond (a stand-in for an animated financing/coin motif) -->
  <g transform="translate(210 195)">
    <animateTransform attributeName="transform" type="translate" values="210,195; 210,181; 210,195" dur="3s" repeatCount="indefinite" additive="sum" />
    <g>
      <animateTransform attributeName="transform" type="rotate" from="45" to="405" dur="14s" repeatCount="indefinite" />
      <rect x="-78" y="-78" width="156" height="156" rx="34" fill="url(#fin-diamond)" />
      <rect x="-78" y="-78" width="156" height="78" rx="34" fill="#ffffff" fill-opacity="0.12" />
      <text x="0" y="14" text-anchor="middle" font-family="Archivo, sans-serif" font-weight="700" font-size="46" fill="#ffffff" fill-opacity="0.9" transform="rotate(-45)">$</text>
    </g>
  </g>
</svg>
